[workspace]
resolver = "2"
members = [
    "crates/popamp-core",
    "crates/popamp-audio",
    "crates/popamp-skin",
    "crates/popamp-plugins",
    "apps/popamp",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.96"
authors = ["Gunyakov <web@gunyakov.pro>", "Sayooj K Karun <sayoojkkarun@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/popamp/popamp"
homepage = "https://github.com/popamp/popamp"

[workspace.dependencies]
popamp-core = { path = "crates/popamp-core" }
popamp-audio = { path = "crates/popamp-audio" }
popamp-skin = { path = "crates/popamp-skin" }
popamp-plugin-api = { git = "https://github.com/popamp/popamp-plugin-api", branch = "main" }
popamp-plugins = { path = "crates/popamp-plugins" }
# Popamp's default skin, a repository of its own so it can be forked alone.
popamp-skin-default = { git = "https://github.com/popamp/popamp-skin-default", branch = "main" }
popamp-visual = { git = "https://github.com/popamp/popamp-visual", branch = "main" }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
libloading = "0.8"
rustysynth = "1.3"
midly = "0.5"
# ReplayGain scanning: EBU R128 loudness, pure Rust.
ebur128 = "0.1"
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "gif", "jpeg", "ico"] }
# Wayland: with the title bars winit draws for dialogs where the desktop
# draws none (GNOME).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
fontdue = "0.9"
# Only the renderer: SVG <text> is not drawn, skins outline their text.
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
fastrand = "2"
ureq = "2"
serde_json = "1"
sha2 = "0.10"
lofty = "0.25"
extism = "1.41"
serde = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
jiff = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
