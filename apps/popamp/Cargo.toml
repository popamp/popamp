[package]
name = "popamp"
description = "A Winamp-style skinnable audio player for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["audio", "music-player", "winamp", "skins", "linux"]
categories = ["multimedia::audio"]

[dependencies]
popamp-core.workspace = true
popamp-audio.workspace = true
popamp-skin.workspace = true
popamp-plugins = { workspace = true, optional = true }
popamp-visual = { workspace = true, optional = true }
winit.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
image.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rustfft.workspace = true
fastrand.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
log.workspace = true
env_logger.workspace = true
jiff.workspace = true

# X11, D-Bus: Linux and the other Unix systems, not macOS. Cargo cannot
# see the `linux_like` cfg that build.rs sets, so it is spelled out here.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The tray icon (StatusNotifierItem), on the same zbus and executor.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# Wayland beside winit, on its connection: the windows winit cannot make
# (see platform/wayland.rs). The versions winit and softbuffer use.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-cursor = "0.31"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Playback", "Storage", "Storage_Streams", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[features]
# Source plug-ins (WebAssembly, run by Extism). Off by default: without
# it Popamp is the player and its skins, and builds without wasmtime.
plugins = ["dep:popamp-plugins"]
# Visualizer plug-ins: their shaders on the GPU, through wgpu. Off by
# default, and needs `plugins`; without it no GPU code is in the program.
visualizers = ["plugins", "dep:popamp-visual"]
# Popamp Plus: every function above. Other mixes are for whoever builds them.
plus = ["plugins", "visualizers"]

